name: Build LiteLLM add-on

on:
  pull_request:
    paths:
      - .github/workflows/build.yaml
      - litellm/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image to GHCR
        required: true
        type: boolean
        default: false
      version:
        description: Version expected in litellm/config.yaml
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read add-on version
        id: addon
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          config = Path("litellm/config.yaml").read_text(encoding="utf-8")
          match = re.search(r'^version:\s*["\']?([^"\'\s]+)', config, re.MULTILINE)
          if match is None:
              raise SystemExit("Unable to read version from litellm/config.yaml")
          version = match.group(1)
          requested_version = os.environ.get("INPUT_VERSION")
          if requested_version and requested_version != version:
              raise SystemExit(
                  f"Requested {requested_version} does not match add-on {version}"
              )
          if os.environ.get("PUBLISH") == "true":
              expected_ref = f"v{version}"
              if (
                  os.environ["GITHUB_REF_TYPE"] != "tag"
                  or os.environ["GITHUB_REF_NAME"] != expected_ref
              ):
                  raise SystemExit(
                      f"Publishing requires tag {expected_ref}"
                  )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
              print(f"image=ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}", file=output)
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish == true }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: inputs.publish == true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./litellm
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish == true }}
          tags: |
            ${{ steps.addon.outputs.image }}:${{ steps.addon.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ steps.addon.outputs.version }}
          cache-from: type=gha,scope=litellm
          cache-to: type=gha,mode=max,scope=litellm
          provenance: mode=max
          sbom: true

      - name: Publish draft GitHub release
        if: inputs.publish == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/publish-github-release.mjs "${{ steps.addon.outputs.version }}"
